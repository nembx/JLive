name: JLive
options:
  bundleIdPrefix: com.nembx
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  JLiveCore:
    path: JLiveCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  JLive:
    type: application
    platform: iOS
    sources:
      - path: JLive
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: JLiveCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nembx.JLive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JLive
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoadsForMedia: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoadsInWebContent: YES
        SUPPORTS_MACCATALYST: NO
    info:
      path: JLive/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: com.nembx.JLive
            CFBundleURLSchemes:
              - jlive
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsArbitraryLoadsInWebContent: true
  JLiveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JLiveUITests
    dependencies:
      - target: JLive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: JLive
  JLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JLiveTests
    dependencies:
      - target: JLive
      - package: JLiveCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  JLive:
    build:
      targets:
        JLive: all
    run:
      config: Debug
    test:
      targets:
        - JLiveTests
        - JLiveUITests
